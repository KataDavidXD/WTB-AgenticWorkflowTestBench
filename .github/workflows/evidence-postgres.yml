name: PostgreSQL evidence contracts

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  postgres-evidence:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: evidence-test-only
          POSTGRES_DB: wtb_evidence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WTB_EVIDENCE_POSTGRES_DSN: postgresql://postgres:evidence-test-only@127.0.0.1:5432/wtb_evidence_test
      WTB_REQUIRE_EVIDENCE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional backend and test dependencies
        run: python -m pip install '.[postgres-evidence,test]'
      - name: Run identical SQLite and PostgreSQL contracts plus crash tests
        run: >-
          python -m pytest -q
          tests/unit/evidence
          tests/integration/evidence_postgres
          --ignore=tests/integration/evidence_postgres/test_runtimes.py
          tests/integration/test_publication_sink_crash.py
          tests/integration/test_external_delivery_crash.py
      - name: Run real LangGraph receipt collection through PostgreSQL
        run: >-
          python -m pytest -q
          tests/integration/evidence_postgres/test_runtimes.py::test_real_langgraph_collector
