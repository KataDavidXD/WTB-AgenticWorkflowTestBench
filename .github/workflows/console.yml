name: Local console acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  console:
    name: Console / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [native, langgraph]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install native API only
        run: python -m pip install -e '.[api]' pytest httpx
      - name: Prove native environment does not import LangGraph
        if: matrix.runtime == 'native'
        run: python -c "import importlib.util; assert importlib.util.find_spec('langgraph') is None"
      - name: Install optional LangGraph backend
        if: matrix.runtime == 'langgraph'
        run: python -m pip install -e '.[langgraph-sqlite]'
      - name: API and real file recovery
        run: python -m pytest tests/test_api/test_console_real.py -q -p no:cacheprovider
      - name: Frontend unit, type and production checks
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
      - name: Real browser acceptance
        working-directory: web
        env:
          WTB_E2E_PYTHON: python
          WTB_E2E_CONFIG: ${{ matrix.runtime == 'langgraph' && '../console-langgraph.json' || '' }}
          WTB_E2E_PREVIEW: '1'
          WTB_E2E_OUTPUT: ../output/playwright/ci
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.runtime }}
          path: output/playwright/ci
