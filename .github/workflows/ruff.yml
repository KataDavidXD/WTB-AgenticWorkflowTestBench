name: Ruff fatal gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff-fatal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.1
      - name: Run fatal Ruff rules
        run: ruff check . --select E9,F63,F7,F82
